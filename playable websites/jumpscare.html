<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jumpscare Horror</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background-color: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
            position: relative;
        }
        button {
            position: absolute;
            padding: 15px 25px;
            background: #222;
            color: #fff;
            border: 2px solid #444;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.2s ease;
        }
        button:hover {
            background: #333;
            border-color: #666;
        }
        #jumpscare {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            display: none;
            z-index: 1000;
        }
        #jumpscare img {
            max-width: 80%;
            max-height: 80%;
            border: 5px solid red;
            box-shadow: 0 0 50px red;
        }
    </style>
</head>
<body>
    <div id="buttonsContainer"></div>
    <div id="jumpscare">
        <img id="jumpscareImg" src="" alt="Scary Image" />
    </div>

    <audio id="jumpscareSound" src="https://www.soundjay.com/horror/sounds/scream-2.mp3" preload="auto"></audio>

    <script>
        const container = document.getElementById('buttonsContainer');
        const jumpscare = document.getElementById('jumpscare');
        const jumpscareImg = document.getElementById('jumpscareImg');
        const jumpscareSound = document.getElementById('jumpscareSound');

        const scaryImages = [
            'https://i.imgur.com/3fJ1Pzt.jpg', // Replace with scary images
            'https://i.imgur.com/8qfDbkp.jpg',
            'https://i.imgur.com/6kR9cFL.jpg'
        ];

        function createRandomButton() {
            const btn = document.createElement('button');
            btn.innerText = "Click me...";
            btn.style.left = Math.random() * (window.innerWidth - 150) + "px";
            btn.style.top = Math.random() * (window.innerHeight - 50) + "px";

            btn.addEventListener('click', () => {
                showJumpscare();
            });

            container.appendChild(btn);

            // Remove button after some time
            setTimeout(() => {
                if(container.contains(btn)) {
                    container.removeChild(btn);
                }
            }, 5000);
        }

        function showJumpscare() {
            const randomImg = scaryImages[Math.floor(Math.random() * scaryImages.length)];
            jumpscareImg.src = randomImg;
            jumpscare.style.display = 'flex';
            jumpscareSound.currentTime = 0;
            jumpscareSound.play();

            // Hide after some time
            setTimeout(() => {
                jumpscare.style.display = 'none';
            }, 1500);
        }

        // Continuously add buttons every second
        setInterval(createRandomButton, 1000);
    </script>
</body>
</html>
