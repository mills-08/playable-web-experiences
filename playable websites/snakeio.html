<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Galaxy Snake Game</title>
    <style>
        body {
            margin: 0;
            background: radial-gradient(ellipse at center, #050515 0%, #000000 100%);
            overflow: hidden;
            font-family: 'Consolas', monospace;
        }
        canvas {
            display: block;
            margin: 0 auto;
            background: #050515;
            box-shadow: 0 0 20px rgba(100, 100, 255, 0.7);
        }
        #score {
            color: #cc33ff;
            text-align: center;
            font-size: 24px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div id="score">Score: 0</div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreDiv = document.getElementById("score");

        const blockSize = 20;
        const width = canvas.width;
        const height = canvas.height;

        let snake = [{x: width / 2, y: height / 2}];
        let direction = "RIGHT";
        let food = spawnFood();
        let score = 0;
        let gameRunning = true;

        // Handle keyboard
        document.addEventListener("keydown", e => {
            if(e.key === "ArrowUp" && direction !== "DOWN") direction = "UP";
            if(e.key === "ArrowDown" && direction !== "UP") direction = "DOWN";
            if(e.key === "ArrowLeft" && direction !== "RIGHT") direction = "LEFT";
            if(e.key === "ArrowRight" && direction !== "LEFT") direction = "RIGHT";
        });

        function spawnFood() {
            let x = Math.floor(Math.random() * (width / blockSize)) * blockSize;
            let y = Math.floor(Math.random() * (height / blockSize)) * blockSize;
            return {x, y};
        }

        function drawStars() {
            for (let i = 0; i < 50; i++) {
                ctx.fillStyle = "rgba(255,255,255,0.5)";
                let x = Math.random() * width;
                let y = Math.random() * height;
                ctx.fillRect(x, y, 1, 1);
            }
        }

        function drawSnake() {
            for(let segment of snake) {
                ctx.fillStyle = "#3266ff";
                ctx.fillRect(segment.x, segment.y, blockSize, blockSize);
                ctx.strokeStyle = "rgba(255,255,255,0.3)";
                ctx.strokeRect(segment.x, segment.y, blockSize, blockSize);
            }
        }

        function drawFood() {
            ctx.fillStyle = "#ff33aa";
            ctx.fillRect(food.x, food.y, blockSize, blockSize);
            ctx.strokeStyle = "rgba(255,255,255,0.3)";
            ctx.strokeRect(food.x, food.y, blockSize, blockSize);
        }

        function moveSnake() {
            let head = {x: snake[0].x, y: snake[0].y};

            if(direction === "UP") head.y -= blockSize;
            if(direction === "DOWN") head.y += blockSize;
            if(direction === "LEFT") head.x -= blockSize;
            if(direction === "RIGHT") head.x += blockSize;

            // Add new head
            snake.unshift(head);

            // Check if food eaten
            if(head.x === food.x && head.y === food.y) {
                score += 10;
                scoreDiv.textContent = "Score: " + score;
                food = spawnFood();
            } else {
                // Remove tail
                snake.pop();
            }
        }

        function checkCollision() {
            let head = snake[0];
            // Wall collision
            if(head.x < 0 || head.x >= width || head.y < 0 || head.y >= height) {
                gameOver();
            }
            // Self collision
            for(let i = 1; i < snake.length; i++) {
                if(head.x === snake[i].x && head.y === snake[i].y) {
                    gameOver();
                }
            }
        }

        function gameOver() {
            gameRunning = false;
            ctx.fillStyle = "#000000";
            ctx.globalAlpha = 0.7;
            ctx.fillRect(0, 0, width, height);
            ctx.globalAlpha = 1;
            ctx.fillStyle = "#ff33aa";
            ctx.font = "48px Consolas";
            ctx.textAlign = "center";
            ctx.fillText("GAME OVER", width/2, height/2 - 20);
            ctx.fillStyle = "#3266ff";
            ctx.font = "24px Consolas";
            ctx.fillText("Final Score: " + score, width/2, height/2 + 20);
        }

        function gameLoop() {
            if(!gameRunning) return;
            ctx.clearRect(0, 0, width, height);
            drawStars();
            moveSnake();
            checkCollision();
            drawFood();
            drawSnake();
        }

        setInterval(gameLoop, 100);
    </script>
</body>
</html>
